<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Verificação Negócios e Etapas - Board Academy</title>
<style>
  :root {
    --gold: #FFD700;
    --bg: #ffffff;
    --card-bg: #f4f4f4;
    --border: #dddddd;
    --text: #111111;
    --muted: #5a5a5a;
    --header-bg: #000000;
    --header-text: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--header-bg);
    color: var(--header-text);
    padding: 18px 24px;
  }
  header .brand { color: var(--gold); font-weight: 800; letter-spacing: 1px; }
  h1 { color: var(--header-text); font-size: 16px; margin: 0; display: inline; font-weight: 500; }
  .separator { color: var(--header-text); font-weight: 400; }
  .header-update-info {
    text-align: right;
    font-size: 11px;
    color: #bbbbbb;
    line-height: 1.5;
    white-space: nowrap;
  }
  .header-update-info .live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6fe28a;
    margin-right: 5px;
  }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .authbar { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .authbar .who { color: #f0f0f0; }
  .btn-auth {
    background: transparent;
    color: #bbbbbb;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .btn-auth:hover { border-color: var(--gold); color: #ffffff; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 200;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #ffffff; color: var(--text); border: 1px solid var(--border);
    border-top: 3px solid var(--gold); border-radius: 14px; padding: 24px;
    width: 320px; max-width: 90vw; box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .modal h3 { margin: 0 0 16px; font-size: 15px; color: var(--text); text-transform: uppercase; letter-spacing: .5px; }
  .modal label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 4px; }
  .modal input {
    width: 100%; background: #ffffff; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  .modal input:focus { outline: none; border-color: var(--gold); }
  .modal .m-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal .m-actions button { flex: 1; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
  .modal .m-ok { background: #000000; color: var(--gold); }
  .modal .m-cancel { background: #f4f4f4; color: var(--text); border: 1px solid var(--border); }
  .modal .m-erro { color: #a11212; font-size: 12px; margin-top: 10px; min-height: 14px; }

  .login-gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; padding: 24px;
  }
  .login-gate-card {
    text-align: center; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 32px; max-width: 320px;
  }
  .login-gate-card h2 { margin: 0 0 8px; font-size: 18px; }
  .login-gate-card p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .login-gate-card .m-ok { background: #000000; color: var(--gold); border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }

  main.page-content { padding: 24px; }
  footer.signature {
    margin-top: 40px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.3px;
    text-transform: none;
    font-weight: 400;
    color: var(--muted);
  }
  .kpis {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .kpi {
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 140px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .kpi .value { font-size: 26px; font-weight: 700; color: var(--text); }

  .funil-block {
    margin-bottom: 32px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .funil-header {
    background: var(--card-bg);
    padding: 14px 18px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    justify-content: space-between;
  }
  .funil-body { padding: 18px; }
  .funil-header.clickable-header { cursor: pointer; }
  .funil-header .funil-total-info { color: var(--muted); }

  .cargo-group { margin-top: 22px; }
  .cargo-group:first-child { margin-top: 0; }
  .cargo-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .colab-table { table-layout: fixed; width: 100%; }
  .colab-table th:nth-child(1), .colab-table td:nth-child(1) { width: 46%; }
  .colab-table th:nth-child(2), .colab-table td:nth-child(2) { width: 27%; text-align: center; }
  .colab-table th:nth-child(3), .colab-table td:nth-child(3) { width: 27%; text-align: center; }
  .etapa-colab-table th:nth-child(1), .etapa-colab-table td:nth-child(1) { width: 32%; }
  .etapa-colab-table th:nth-child(2), .etapa-colab-table td:nth-child(2) { width: 18%; text-align: center; }
  .etapa-colab-table th:nth-child(3), .etapa-colab-table td:nth-child(3) { width: 18%; text-align: center; }
  .etapa-colab-table th:nth-child(4), .etapa-colab-table td:nth-child(4) { width: 32%; text-align: center; }

  .cargo-cards {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .cargo-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 100px;
  }
  .cargo-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .cargo-card .value { font-size: 20px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
  tr:hover { background: rgba(0,0,0,0.03); }
  .empty { color: var(--muted); font-style: italic; padding: 10px; }
  .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  select {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .cargo-card.clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .cargo-card.clickable:hover { border-color: var(--gold); }
  .cargo-card.clickable.active { border-color: var(--gold); background: rgba(255,215,0,0.08); }
  .cargo-card.total-card { border-color: var(--gold); background: rgba(255,215,0,0.05); }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    margin-left: 6px;
  }
  .status-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 5px;
  }
  .status-green { background: #d9f2df; color: #146c2e; }
  .status-yellow { background: #fdedc8; color: #8a5a00; }
  .status-red { background: #fbdada; color: #a11212; }
  .pessoa-row { cursor: pointer; }
  .pessoa-nome { color: var(--text); text-decoration: underline; text-decoration-style: solid; }
  .dropdown-row td { background: #f8f8f8; padding: 10px 10px 14px 24px; }
  .negocios-table { font-size: 12px; }
  .negocios-table th, .negocios-table td { border-bottom: 1px solid #e5e5e5; padding: 6px 8px; }
  .negocios-table a { color: #1a56c4; text-decoration: none; }
  .negocios-table a:hover { text-decoration: underline; }

  .tabs {
    display: flex;
    gap: 8px;
    background: var(--header-bg);
    padding: 0 24px;
    margin: 0;
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    color: #999999;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 12px 6px;
    margin-right: 18px;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--header-text); border-bottom-color: var(--gold); }
  .etapa-group { margin-top: 18px; }
  .etapa-group:first-child { margin-top: 0; }
  .etapa-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  .etapa-header .dias-tag {
    font-size: 11px;
    font-weight: 700;
    color: #a11212;
    background: #fbdada;
    padding: 3px 8px;
    border-radius: 5px;
    margin-left: 8px;
  }
  .colab-list { margin-top: 4px; }
  .colab-item { border-bottom: 1px solid var(--border); }
  .colab-item:last-child { border-bottom: none; }
  .colab-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    cursor: pointer;
  }
  .colab-item-header:hover { background: rgba(0,0,0,0.03); }
  .colab-item-seta { color: var(--muted); font-size: 11px; }
  .colab-item-body { padding: 4px 4px 16px 16px; }
  .colab-item-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="modal-bg" id="loginModal">
  <div class="modal">
    <h3>Acesso restrito</h3>
    <label>Usuário</label>
    <input id="in-user" autocomplete="username" />
    <label>Senha</label>
    <input id="in-pass" type="password" autocomplete="current-password" />
    <div class="m-erro" id="loginErro"></div>
    <div class="m-actions">
      <button class="m-cancel" id="loginCancel">Cancelar</button>
      <button class="m-ok" id="loginOk">Entrar</button>
    </div>
  </div>
</div>

<header>
  <div><span class="brand">BOARD ACADEMY</span> <span class="separator">-</span> <h1>Verificação Negócios e Etapas</h1></div>
  <div class="header-right">
    <span class="header-update-info" id="headerUpdateInfo"></span>
    <div class="authbar">
      <span class="who" id="authWho"></span>
      <button class="btn-auth" id="btnAuth">Entrar</button>
    </div>
  </div>
</header>

<div class="login-gate" id="loginGate">
  <div class="login-gate-card">
    <h2>Acesso restrito</h2>
    <p>Faça login pra ver o painel.</p>
    <button class="m-ok" onclick="abreLogin()">Entrar</button>
  </div>
</div>

<div id="appContent" style="display: none;">
<nav class="tabs">
  <button class="tab-btn active" id="tabBtnNegocios" onclick="switchTab('negocios')">NEGÓCIOS ABERTOS</button>
  <button class="tab-btn" id="tabBtnEtapas" onclick="switchTab('etapas')">ETAPAS</button>
</nav>

<main class="page-content">
<div id="tabNegocios">
  <div class="kpis" id="kpis"></div>

  <div class="funil-block" id="resumoEquipes"></div>

  <div class="funil-block" id="totalColaboradores"></div>

  <div class="filters">
    <select id="filterTime">
      <option value="">Todos os times</option>
      <option value="SNIPER">Sniper</option>
      <option value="OLYMPUS">Olympus</option>
      <option value="ELITE">Elite</option>
      <option value="NAVIGATOR">Navigator</option>
      <option value="ZENITE">Zenite</option>
    </select>
  </div>

  <div id="dashboard">Carregando...</div>
</div>

<div id="tabEtapas" style="display: none;">
  <div class="kpis" id="etapasKpis"></div>
  <div id="etapasDashboard">Carregando...</div>
</div>

<footer class="signature">
  Board Academy · Time Comercial
</footer>
</main>
</div>

<script>
let rawData = null;

async function loadData() {
  const res = await fetch('/api/deals', { headers: authHeaders() });
  if (res.status === 401) { return forcaLogout(); }
  rawData = await res.json();
  atualizaOpcoesFiltro();
  renderKpis();
  renderResumoEquipes();
  renderTotalColaboradores();
  renderDashboard();
  updateHeaderTimestamp();
}

function updateHeaderTimestamp() {
  const el = document.getElementById('headerUpdateInfo');
  if (!el) return;
  const agora = new Date();
  const dataFormatada = agora.toLocaleDateString('pt-BR');
  const horaFormatada = agora.toLocaleTimeString('pt-BR');
  el.innerHTML = `
    Atualizado: ${dataFormatada}, ${horaFormatada}<br>
    <span class="live-dot"></span>atualiza sozinho a cada 30 min
  `;
}

function renderKpis() {
  const kpisEl = document.getElementById('kpis');
  kpisEl.innerHTML = `
    <div class="kpi"><div class="label">Total de negócios</div><div class="value">${rawData.total_negocios}</div></div>
    <div class="kpi"><div class="label">Donos não mapeados</div><div class="value">${rawData.donos_nao_mapeados.length}</div></div>
  `;
}

function renderResumoEquipes() {
  const el = document.getElementById('resumoEquipes');
  const timeFilter = document.getElementById('filterTime').value;
  const totalGeral = rawData.resumo_equipes.reduce((acc, r) => acc + r.total, 0);
  el.innerHTML = `
    <div class="funil-header"><span>TOTAL GERAL POR EQUIPE</span></div>
    <div class="funil-body">
      <div class="cargo-cards">
        ${rawData.resumo_equipes.map(r => `
          <div class="cargo-card clickable ${timeFilter === r.time ? 'active' : ''}" onclick="selectTeamFilter('${r.time}')">
            <div class="label">${r.time}</div><div class="value">${r.total}</div>
          </div>
        `).join('')}
        <div class="cargo-card total-card">
          <div class="label">Total</div><div class="value">${totalGeral}</div>
        </div>
      </div>
    </div>
  `;
}

function selectTeamFilter(time) {
  const select = document.getElementById('filterTime');
  select.value = (select.value === time) ? '' : time;
  renderResumoEquipes();
  renderDashboard();
}

let totalColaboradoresAberto = false;

function toggleTotalColaboradores() {
  totalColaboradoresAberto = !totalColaboradoresAberto;
  renderTotalColaboradores();
}

function renderTotalColaboradores() {
  const el = document.getElementById('totalColaboradores');
  const pessoas = rawData.total_por_colaborador || [];

  const ordem = ['SDR', 'CLOSER', 'HEAD', 'TEAM_LEADER', 'OUTROS', 'NAO_MAPEADO'];
  const grupos = {};
  ordem.forEach(c => grupos[c] = []);
  pessoas.forEach(p => {
    if (!grupos[p.cargo]) grupos[p.cargo] = [];
    grupos[p.cargo].push(p);
  });

  const corpo = totalColaboradoresAberto
    ? `
      <div class="funil-body">
        ${ordem.filter(c => grupos[c].length).map(cargo => `
          <div class="cargo-group">
            <div class="cargo-title">${cargoLabel(cargo)} (${grupos[cargo].length})</div>
            <table class="colab-table">
              <thead><tr><th>Colaborador</th><th>Negócios abertos</th><th>Status</th></tr></thead>
              <tbody>
                ${grupos[cargo].map(p => {
                  const dropdownId = `dropdown-${dropdownCounter++}`;
                  return `
                    <tr class="pessoa-row" onclick="togglePessoa('${dropdownId}')">
                      <td><span class="pessoa-nome">${p.nome}</span></td>
                      <td>${p.quantidade}</td>
                      <td>${p.status ? `<span class="status-badge status-${p.status.color}">${p.status.label}</span>` : '-'}</td>
                    </tr>
                    <tr id="${dropdownId}" class="dropdown-row" style="display: none;">
                      <td colspan="3">
                        <table class="negocios-table">
                          <thead><tr><th>Funil</th><th>Negócios abertos</th></tr></thead>
                          <tbody>
                            ${(p.por_funil || []).map(f => `
                              <tr><td>${f.funil}</td><td>${f.quantidade}</td></tr>
                            `).join('')}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `).join('')}
      </div>
    `
    : '';

  el.innerHTML = `
    <div class="funil-header clickable-header" onclick="toggleTotalColaboradores()">
      <span>TOTAL POR COLABORADOR</span>
      <span>${totalColaboradoresAberto ? '▲' : '▼'}</span>
    </div>
    ${corpo}
  `;
}

function cargoLabel(cargo) {
  const labels = {
    SDR: 'SDR',
    CLOSER: 'Closer',
    HEAD: 'Head',
    TEAM_LEADER: 'Team Leader',
    OUTROS: 'Outros',
    NAO_MAPEADO: 'não mapeado',
  };
  return labels[cargo] || cargo;
}

let dropdownCounter = 0;

function renderNegocioValor(negocio) {
  if (!negocio.valor) return '-';
  return Number(negocio.valor).toLocaleString('pt-BR', {style: 'currency', currency: negocio.moeda || 'BRL'});
}

function renderNegociosDropdown(negocios, dropdownId) {
  return `
    <tr id="${dropdownId}" class="dropdown-row" style="display: none;">
      <td colspan="4">
        <table class="negocios-table">
          <thead><tr><th>Negócio</th><th>Valor</th><th>Etapa</th></tr></thead>
          <tbody>
            ${negocios.map(n => `
              <tr>
                <td><a href="${n.url}" target="_blank" rel="noopener">${n.nome || 'Negócio #' + n.id}</a></td>
                <td>${renderNegocioValor(n)}</td>
                <td>${n.etapa || '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </td>
    </tr>
  `;
}

function togglePessoa(dropdownId) {
  const row = document.getElementById(dropdownId);
  if (row) {
    row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
  }
}

function renderPessoaTable(pessoas) {
  if (!pessoas.length) return '<div class="empty">Nenhum negócio</div>';
  return `
    <table>
      <thead><tr><th>Proprietário</th><th>Cargo</th><th>Negócios abertos</th><th>Status</th></tr></thead>
      <tbody>
        ${pessoas.map(p => {
          const dropdownId = `dropdown-${dropdownCounter++}`;
          return `
            <tr class="pessoa-row" onclick="togglePessoa('${dropdownId}')">
              <td><span class="pessoa-nome">${p.nome}</span></td>
              <td>${p.cargo === 'NAO_MAPEADO' ? `<span class="badge">${cargoLabel(p.cargo)}</span>` : cargoLabel(p.cargo)}</td>
              <td>${p.quantidade}</td>
              <td>${p.status ? `<span class="status-badge status-${p.status.color}">${p.status.label}</span>` : '-'}</td>
            </tr>
            ${renderNegociosDropdown(p.negocios || [], dropdownId)}
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

let funisAbertos = {};

function toggleFunil(nome) {
  funisAbertos[nome] = !funisAbertos[nome];
  renderDashboard();
}

function renderDashboard() {
  const timeFilter = document.getElementById('filterTime').value;
  const dashboardEl = document.getElementById('dashboard');
  dashboardEl.innerHTML = '';

  Object.entries(rawData.funis).forEach(([funilNome, info]) => {
    if (timeFilter && timeFilter !== funilNome) return;

    const aberto = !!funisAbertos[funilNome];

    const block = document.createElement('div');
    block.className = 'funil-block';

    const corpo = aberto
      ? `
        <div class="funil-body">
          <div class="cargo-cards">
            <div class="cargo-card"><div class="label">SDR</div><div class="value">${info.por_cargo.SDR}</div></div>
            <div class="cargo-card"><div class="label">Closer</div><div class="value">${info.por_cargo.CLOSER}</div></div>
            <div class="cargo-card"><div class="label">Head</div><div class="value">${info.por_cargo.HEAD}</div></div>
            <div class="cargo-card"><div class="label">Team Leader</div><div class="value">${info.por_cargo.TEAM_LEADER}</div></div>
            <div class="cargo-card"><div class="label">Outros</div><div class="value">${info.por_cargo.OUTROS}</div></div>
            <div class="cargo-card"><div class="label">Não mapeados</div><div class="value">${info.por_cargo.NAO_MAPEADO}</div></div>
          </div>
          ${renderPessoaTable(info.por_pessoa)}
        </div>
      `
      : '';

    block.innerHTML = `
      <div class="funil-header clickable-header" onclick="toggleFunil('${funilNome}')">
        <span>${funilNome}</span>
        <span class="funil-total-info">${info.total} negócios ${aberto ? '▲' : '▼'}</span>
      </div>
      ${corpo}
    `;
    dashboardEl.appendChild(block);
  });
}

document.getElementById('filterTime').addEventListener('change', renderDashboard);

// ---------------------------------------------------------------------------
// Aba ETAPAS (negócios parados por funil/etapa/colaborador)
// ---------------------------------------------------------------------------

let etapasData = null;
let etapasFunisAbertos = {};
let etapasEtapasAbertas = {};

function switchTab(tab) {
  document.getElementById('tabBtnNegocios').classList.toggle('active', tab === 'negocios');
  document.getElementById('tabBtnEtapas').classList.toggle('active', tab === 'etapas');
  document.getElementById('tabNegocios').style.display = tab === 'negocios' ? '' : 'none';
  document.getElementById('tabEtapas').style.display = tab === 'etapas' ? '' : 'none';
  if (tab === 'etapas' && !etapasData) {
    loadEtapasData();
  }
}

async function loadEtapasData() {
  document.getElementById('etapasDashboard').innerHTML = 'Carregando...';
  const res = await fetch('/api/etapas', { headers: authHeaders() });
  if (res.status === 401) { return forcaLogout(); }
  etapasData = await res.json();
  renderEtapasKpis();
  renderEtapasDashboard();
}

function renderEtapasKpis() {
  const el = document.getElementById('etapasKpis');
  const totalParados = Object.values(etapasData.funis).reduce((acc, f) => acc + f.total_parados, 0);
  el.innerHTML = `
    <div class="kpi"><div class="label">Negócios parados (≥ ${etapasData.dias_limite} dias)</div><div class="value">${totalParados}</div></div>
  `;
}

function toggleEtapaFunil(nome) {
  etapasFunisAbertos[nome] = !etapasFunisAbertos[nome];
  renderEtapasDashboard();
}

function toggleEtapaGrupo(chave) {
  etapasEtapasAbertas[chave] = !etapasEtapasAbertas[chave];
  renderEtapasDashboard();
}

function toggleColaboradorEtapa(itemId) {
  const el = document.getElementById(itemId);
  if (!el) return;
  const aberto = el.style.display !== 'none';
  el.style.display = aberto ? 'none' : 'block';
  const seta = document.getElementById(itemId + '-seta');
  if (seta) seta.textContent = aberto ? '▼' : '▲';
}

function renderDiasSemAtividade(dias) {
  if (dias === null || dias === undefined) return '-';
  if (dias <= 3) {
    return `<span class="status-badge status-green">OK</span>`;
  }
  return `${dias} dias`;
}

function renderEtapaNegociosTable(negocios) {
  return `
    <table class="negocios-table">
      <thead><tr><th>Negócio</th><th>Dias parado</th><th>Dias sem atividade</th><th>Dias sem anotações</th><th>Situação</th></tr></thead>
      <tbody>
        ${negocios.map(n => `
          <tr>
            <td><a href="${n.url}" target="_blank" rel="noopener">${n.nome || 'Negócio #' + n.id}</a></td>
            <td>${n.dias_parado}</td>
            <td>${renderDiasSemAtividade(n.dias_sem_atividade)}</td>
            <td>${renderDiasSemAtividade(n.dias_sem_nota)}</td>
            <td>${n.motivo ? `<span class="status-badge status-${n.motivo.startsWith('Acima') ? 'red' : 'yellow'}">${n.motivo}</span>` : '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderEtapaPessoaTable(pessoas) {
  if (!pessoas.length) return '<div class="empty">Nenhum negócio parado</div>';
  return `
    <div class="colab-list">
      ${pessoas.map(p => {
        const itemId = `colab-etapa-${dropdownCounter++}`;
        return `
          <div class="colab-item">
            <div class="colab-item-header" onclick="toggleColaboradorEtapa('${itemId}')">
              <span class="pessoa-nome">${p.nome}</span>
              <span class="colab-item-seta" id="${itemId}-seta">▼</span>
            </div>
            <div class="colab-item-body" id="${itemId}" style="display: none;">
              <div class="colab-item-stats">
                <span>${cargoLabel(p.cargo)}</span>
                <span>${p.quantidade} parado${p.quantidade === 1 ? '' : 's'}</span>
                <span>${p.media_dias} / ${p.max_dias} dias (méd. / máx.)</span>
              </div>
              ${renderEtapaNegociosTable(p.negocios || [])}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderEtapasDashboard() {
  const el = document.getElementById('etapasDashboard');
  el.innerHTML = '';

  Object.entries(etapasData.funis).forEach(([funilNome, info]) => {
    const abertoFunil = !!etapasFunisAbertos[funilNome];
    const block = document.createElement('div');
    block.className = 'funil-block';

    const corpo = abertoFunil
      ? `
        <div class="funil-body">
          ${info.etapas.length ? info.etapas.map(etapa => {
            const chave = `${funilNome}::${etapa.etapa}`;
            const abertoEtapa = !!etapasEtapasAbertas[chave];
            return `
              <div class="etapa-group">
                <div class="etapa-header" onclick="toggleEtapaGrupo('${chave}')">
                  <span>${etapa.etapa}</span>
                  <span><span class="dias-tag">${etapa.total} parado${etapa.total === 1 ? '' : 's'}</span> ${abertoEtapa ? '▲' : '▼'}</span>
                </div>
                ${abertoEtapa ? renderEtapaPessoaTable(etapa.por_pessoa) : ''}
              </div>
            `;
          }).join('') : '<div class="empty">Nenhum negócio parado nesse funil</div>'}
        </div>
      `
      : '';

    block.innerHTML = `
      <div class="funil-header clickable-header" onclick="toggleEtapaFunil('${funilNome}')">
        <span>${funilNome}</span>
        <span class="funil-total-info">${info.total_parados} parados ${abertoFunil ? '▲' : '▼'}</span>
      </div>
      ${corpo}
    `;
    el.appendChild(block);
  });
}

// ---------------------------------------------------------------------------
// Autenticação (login com papéis ADMIN / ELITE / OLYMPUS)
// ---------------------------------------------------------------------------

let TOKEN = sessionStorage.getItem('dash_token') || null;
let USUARIO = sessionStorage.getItem('dash_user') || null;
let PAPEL = sessionStorage.getItem('dash_papel') || null;

function authHeaders() {
  return TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {};
}
function ehPriv() { return !!TOKEN; }

function atualizaOpcoesFiltro() {
  const select = document.getElementById('filterTime');
  if (!select || !rawData) return;
  const atual = select.value;
  const times = Object.keys(rawData.funis || {});
  select.innerHTML = '<option value="">Todos os times</option>' +
    times.map(t => `<option value="${t}">${t.charAt(0) + t.slice(1).toLowerCase()}</option>`).join('');
  if (times.includes(atual)) select.value = atual;
}

function abreLogin() {
  document.getElementById('loginErro').textContent = '';
  document.getElementById('in-user').value = '';
  document.getElementById('in-pass').value = '';
  document.getElementById('loginModal').classList.add('show');
  document.getElementById('in-user').focus();
}
function fechaLogin() { document.getElementById('loginModal').classList.remove('show'); }

async function fazLogin() {
  const usuario = document.getElementById('in-user').value.trim();
  const senha = document.getElementById('in-pass').value;
  document.getElementById('loginErro').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({usuario, senha}),
    });
    const d = await res.json();
    if (!res.ok) {
      document.getElementById('loginErro').textContent = d.error || 'Falha no login';
      return;
    }
    TOKEN = d.token; USUARIO = d.usuario; PAPEL = d.papel;
    sessionStorage.setItem('dash_token', TOKEN);
    sessionStorage.setItem('dash_user', USUARIO);
    sessionStorage.setItem('dash_papel', PAPEL);
    fechaLogin();
    entrarNoApp();
  } catch (e) {
    document.getElementById('loginErro').textContent = 'Erro de conexão';
  }
}

function logout() {
  TOKEN = null; USUARIO = null; PAPEL = null;
  rawData = null; etapasData = null;
  sessionStorage.removeItem('dash_token');
  sessionStorage.removeItem('dash_user');
  sessionStorage.removeItem('dash_papel');
  atualizaAuthUI();
  document.getElementById('appContent').style.display = 'none';
  document.getElementById('loginGate').style.display = 'flex';
}

function forcaLogout() {
  // token expirou/inválido no meio da sessão
  logout();
}

function atualizaAuthUI() {
  if (ehPriv()) {
    document.getElementById('authWho').textContent = `● ${USUARIO} (${PAPEL})`;
    document.getElementById('btnAuth').textContent = 'Sair';
  } else {
    document.getElementById('authWho').textContent = '';
    document.getElementById('btnAuth').textContent = 'Entrar';
  }
}

function entrarNoApp() {
  atualizaAuthUI();
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  loadData();
}

async function validaTokenSalvo() {
  if (!TOKEN) { atualizaAuthUI(); return; }
  try {
    const me = await (await fetch('/api/me', { headers: authHeaders() })).json();
    if (!me.autenticado) {
      TOKEN = null; USUARIO = null; PAPEL = null;
      sessionStorage.removeItem('dash_token');
      sessionStorage.removeItem('dash_user');
      sessionStorage.removeItem('dash_papel');
      atualizaAuthUI();
      return;
    }
    USUARIO = me.usuario; PAPEL = me.papel;
    entrarNoApp();
  } catch (e) {
    atualizaAuthUI();
  }
}

document.getElementById('btnAuth').addEventListener('click', () => { ehPriv() ? logout() : abreLogin(); });
document.getElementById('loginCancel').addEventListener('click', fechaLogin);
document.getElementById('loginOk').addEventListener('click', fazLogin);
document.getElementById('in-pass').addEventListener('keydown', e => { if (e.key === 'Enter') fazLogin(); });
document.getElementById('loginModal').addEventListener('click', e => { if (e.target.id === 'loginModal') fechaLogin(); });

setInterval(() => { if (ehPriv()) loadData(); }, 30 * 60 * 1000);
validaTokenSalvo();
</script>

</body>
</html>
